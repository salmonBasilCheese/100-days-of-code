name: Daily Stock News Alert

on:
  schedule:
    # 毎朝 JST 06:30 (UTC 21:30) に実行（火曜〜土曜：米国市場クローズ後）
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  check-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'stock_news_alert/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r stock_news_alert/requirements.txt

      - name: Execute Stock News Alert script
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VOLATILITY_THRESHOLD: '5.0'
        run: |
          python stock_news_alert/main.py