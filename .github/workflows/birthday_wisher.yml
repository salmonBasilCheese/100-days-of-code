name: Automated Birthday Wisher

on:
  schedule:
    # 毎日 UTC 22:00 (日本時間 朝 07:00) に自動実行
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Test target date (MM-DD format, e.g. 12-24). Leave blank for today.'
        required: false
        default: ''

jobs:
  send-birthday-wishes:
    runs-on: ubuntu-latest

    # birthday_wisher フォルダを基準にコマンドを実行
    defaults:
      run:
        working-directory: ./birthday_wisher

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: birthday_wisher/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Birthday Wisher
        env:
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: |
          python main.py